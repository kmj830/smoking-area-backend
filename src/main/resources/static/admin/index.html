<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>흡연구역 제보 검수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c1b19;
    --panel: #232220;
    --panel-raised: #2a2926;
    --line: #3a3834;
    --text: #ede9e0;
    --text-dim: #96917f;
    --amber: #f2a93b;
    --green: #7fae83;
    --rust: #c25c46;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .display{ font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.04em; }

  /* --- 로그인 게이트 --- */
  #gate{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  #gate.hidden{ display:none; }
  .gate-box{
    width:320px; padding:32px 28px;
    background:var(--panel); border:1px solid var(--line);
    position:relative;
  }
  .gate-box::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background:repeating-linear-gradient(135deg, var(--amber) 0 10px, #232220 10px 20px);
  }
  .gate-box h1{ font-size:20px; margin-bottom:6px; }
  .gate-box p{ color:var(--text-dim); font-size:13px; margin-bottom:20px; }
  .gate-box label{ display:block; font-size:11px; color:var(--text-dim); margin-bottom:5px; letter-spacing:0.02em; }
  .gate-box input{
    width:100%; padding:10px 12px; background:var(--bg);
    border:1px solid var(--line); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:14px;
    margin-bottom:14px;
  }
  .gate-box input:focus{ outline:none; border-color:var(--amber); }
  .gate-box button{
    width:100%; padding:11px; background:var(--amber); color:#1c1b19;
    border:none; font-weight:600; font-size:13px; letter-spacing:0.03em;
    text-transform:uppercase; cursor:pointer;
  }
  .gate-box button:hover{ filter:brightness(1.08); }
  .gate-error{ color:var(--rust); font-size:12px; margin-top:10px; min-height:14px; }

  /* --- 헤더 --- */
  header{
    padding:22px 32px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between;
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  header .title{ display:flex; align-items:baseline; gap:12px; }
  header h1{ font-size:22px; }
  header .subtitle{ color:var(--text-dim); font-size:13px; }
  header .logout{ color:var(--text-dim); font-size:12px; cursor:pointer; background:none; border:none; }
  header .logout:hover{ color:var(--text); }

  /* --- 탭 --- */
  .tabs{
    display:flex; gap:0; padding:0 32px; border-bottom:1px solid var(--line);
  }
  .tab{
    padding:14px 18px; font-size:13px; color:var(--text-dim); cursor:pointer;
    border-bottom:2px solid transparent; display:flex; align-items:center; gap:8px;
  }
  .tab.active{ color:var(--text); border-bottom-color:var(--amber); }
  .tab .count{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    background:var(--panel-raised); padding:1px 6px;
  }

  main{ padding:28px 32px 60px; max-width:900px; margin:0 auto; }

  .empty{ color:var(--text-dim); font-size:13px; padding:60px 0; text-align:center; }

  /* --- 카드 --- */
  .card{
    display:flex; gap:18px; background:var(--panel);
    border:1px solid var(--line); margin-bottom:14px; padding:16px;
  }
  .card-img{
    width:120px; height:120px; flex-shrink:0; background:var(--panel-raised);
    object-fit:cover; display:block;
  }
  .card-img.placeholder{
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:11px; text-align:center;
  }
  .card-body{ flex:1; min-width:0; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .card-name{ font-size:16px; font-weight:600; }
  .badge{
    font-size:10px; padding:3px 7px; letter-spacing:0.03em; text-transform:uppercase;
    font-weight:600; flex-shrink:0; white-space:nowrap;
  }
  .badge.NEW_SMOKING_AREA{ background:rgba(242,169,59,0.15); color:var(--amber); }
  .badge.OPERATION{ background:rgba(127,174,131,0.15); color:var(--green); }
  .badge.CONGESTION{ background:rgba(150,145,127,0.18); color:var(--text-dim); }

  .card-meta{ margin-top:8px; font-size:12px; color:var(--text-dim); line-height:1.7; }
  .card-meta .mono{ color:var(--text); }
  .card-meta div{ display:flex; gap:6px; }
  .card-meta .label{ width:64px; flex-shrink:0; color:var(--text-dim); }

  .card-actions{ margin-top:14px; display:flex; gap:8px; }
  .btn{
    padding:8px 16px; font-size:12px; font-weight:600; border:1px solid var(--line);
    background:transparent; color:var(--text); cursor:pointer; letter-spacing:0.02em;
  }
  .btn.approve{ border-color:var(--green); color:var(--green); }
  .btn.approve:hover{ background:rgba(127,174,131,0.12); }
  .btn.reject{ border-color:var(--rust); color:var(--rust); }
  .btn.reject:hover{ background:rgba(194,92,70,0.12); }
  .btn:disabled{ opacity:0.35; cursor:default; }

  .status-tag{ font-size:11px; margin-top:12px; }
  .status-tag.approved{ color:var(--green); }
  .status-tag.rejected{ color:var(--rust); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel-raised); border:1px solid var(--line);
    padding:10px 18px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity 0.2s; max-width:80%; text-align:center;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

  <div id="gate">
    <div class="gate-box">
      <h1 class="display">Admin Access</h1>
      <p>제보 검수를 위해 관리자 정보를 입력하세요.</p>
      <label>관리자 키</label>
      <input type="password" id="keyInput" placeholder="ADMIN KEY" autocomplete="off">
      <label>관리자 계정 ID (role=ADMIN인 유저의 id)</label>
      <input type="number" id="adminUserIdInput" placeholder="예: 1" autocomplete="off">
      <button onclick="login()">입장</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>

  <div id="app" style="display:none;">
    <header>
      <div class="title">
        <h1 class="display">제보 검수</h1>
        <span class="subtitle">흡연구역 신고 관리</span>
      </div>
      <button class="logout" onclick="logout()">로그아웃</button>
    </header>

    <div class="tabs">
      <div class="tab active" data-status="PENDING" onclick="switchTab('PENDING')">대기중 <span class="count" id="count-PENDING">0</span></div>
      <div class="tab" data-status="APPROVED" onclick="switchTab('APPROVED')">승인됨 <span class="count" id="count-APPROVED">0</span></div>
      <div class="tab" data-status="REJECTED" onclick="switchTab('REJECTED')">반려됨 <span class="count" id="count-REJECTED">0</span></div>
    </div>

    <main id="list"></main>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const API_BASE = ''; // 같은 오리진에서 서빙되므로 비워둠. 별도 도메인이면 백엔드 URL 입력.
  const TYPE_LABEL = {
    NEW_SMOKING_AREA: '신규 제보',
    OPERATION: '운영상태 제보',
    CONGESTION: '혼잡도 제보'
  };

  let adminKey = localStorage.getItem('admin_key') || '';
  let adminUserId = localStorage.getItem('admin_user_id') || '';
  let currentTab = 'PENDING';
  let reports = [];

  function headers(){
    return { 'X-Admin-Key': adminKey };
  }

  async function login(){
    const key = document.getElementById('keyInput').value.trim();
    const uid = document.getElementById('adminUserIdInput').value.trim();
    if(!key || !uid){ return; }

    const res = await fetch(`${API_BASE}/api/admin/reports/ping`, { headers: { 'X-Admin-Key': key } });
    if(res.ok){
      adminKey = key;
      adminUserId = uid;
      localStorage.setItem('admin_key', key);
      localStorage.setItem('admin_user_id', uid);
      enterApp();
    } else {
      document.getElementById('gateError').textContent = '키가 올바르지 않습니다.';
    }
  }

  function enterApp(){
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    loadAll();
  }

  function logout(){
    localStorage.removeItem('admin_key');
    localStorage.removeItem('admin_user_id');
    location.reload();
  }

  function switchTab(status){
    currentTab = status;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.status === status));
    render();
  }

  async function loadAll(){
    const res = await fetch(`${API_BASE}/api/admin/reports`, { headers: headers() });
    if(res.status === 401){ logout(); return; }
    reports = await res.json();
    updateCounts();
    render();
  }

  function updateCounts(){
    ['PENDING','APPROVED','REJECTED'].forEach(s => {
      document.getElementById(`count-${s}`).textContent = reports.filter(r => r.reportStatus === s).length;
    });
  }

  function render(){
    const list = document.getElementById('list');
    const filtered = reports.filter(r => r.reportStatus === currentTab)
      .sort((a,b) => b.id - a.id);

    if(filtered.length === 0){
      list.innerHTML = `<div class="empty">이 상태의 제보가 없습니다.</div>`;
      return;
    }

    list.innerHTML = filtered.map(r => cardHtml(r)).join('');
  }

  function cardHtml(r){
    const isNew = r.reportType === 'NEW_SMOKING_AREA';
    const name = isNew ? (r.suggestedName || '(이름 미기재)') : (r.smokingAreaName || `흡연구역 #${r.smokingAreaId}`);
    const img = r.imageUrl
      ? `<img class="card-img" src="${r.imageUrl}" alt="제보 이미지">`
      : `<div class="card-img placeholder">이미지<br>없음</div>`;

    let actions = '';
    if(r.reportStatus === 'PENDING'){
      actions = `
        <div class="card-actions">
          <button class="btn approve" onclick="approve(${r.id})">승인</button>
          <button class="btn reject" onclick="reject(${r.id})">반려</button>
        </div>`;
    } else if(r.reportStatus === 'APPROVED'){
      actions = `<div class="status-tag approved">✓ 승인 처리됨</div>`;
    } else {
      actions = `<div class="status-tag rejected">✕ 반려됨${r.rejectReason ? ' · ' + escapeHtml(r.rejectReason) : ''}</div>`;
    }

    return `
      <div class="card" id="card-${r.id}">
        ${img}
        <div class="card-body">
          <div class="card-top">
            <div class="card-name">${escapeHtml(name)}</div>
            <div class="badge ${r.reportType}">${TYPE_LABEL[r.reportType] || r.reportType}</div>
          </div>
          <div class="card-meta">
            <div><span class="label">제보자</span><span class="mono">${escapeHtml(r.userNickname)}</span></div>
            ${r.address ? `<div><span class="label">주소</span><span>${escapeHtml(r.address)}</span></div>` : ''}
            ${(r.latitude && r.longitude) ? `<div><span class="label">좌표</span><span class="mono">${r.latitude}, ${r.longitude}</span></div>` : ''}
            ${r.operationStatus ? `<div><span class="label">운영상태</span><span>${r.operationStatus}</span></div>` : ''}
            ${r.congestionLevel ? `<div><span class="label">혼잡도</span><span>${r.congestionLevel}</span></div>` : ''}
          </div>
          ${actions}
        </div>
      </div>`;
  }

  async function approve(id){
    if(!confirm('이 제보를 승인하시겠습니까? 흡연구역 정보에 즉시 반영됩니다.')) return;
    const res = await fetch(`${API_BASE}/api/admin/reports/${id}/approve?adminUserId=${adminUserId}`, {
      method:'PATCH',
      headers: headers()
    });
    if(res.ok){
      showToast('승인 처리되었습니다.');
      await loadAll();
    } else {
      const err = await res.json().catch(() => ({}));
      showToast(err.message || '처리에 실패했습니다.');
    }
  }

  async function reject(id){
    const reason = prompt('반려 사유를 입력하세요 (선택)') || '';
    const res = await fetch(`${API_BASE}/api/admin/reports/${id}/reject?adminUserId=${adminUserId}`, {
      method:'PATCH',
      headers: { ...headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason })
    });
    if(res.ok){
      showToast('반려 처리되었습니다.');
      await loadAll();
    } else {
      const err = await res.json().catch(() => ({}));
      showToast(err.message || '처리에 실패했습니다.');
    }
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function escapeHtml(str){
    if(str === null || str === undefined) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // 자동 로그인 시도
  if(adminKey && adminUserId){
    fetch(`${API_BASE}/api/admin/reports/ping`, { headers: { 'X-Admin-Key': adminKey } })
      .then(res => { if(res.ok){ enterApp(); } });
  }

  document.getElementById('adminUserIdInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') login();
  });
</script>
</body>
</html>
