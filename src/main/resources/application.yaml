server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  data-initializer:
    enabled: ${DATA_INITIALIZER_ENABLED:false}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger
    operations-sorter: alpha

# --- 카카오 로그인 및 JWT 설정 추가 ---
kakao:
  client-id: ${KAKAO_CLIENT_ID:ad6819c72b512ad17b6b7ebd4210ead1}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/mypage}

jwt:
  # 256비트 이상의 문자열로, 실제 서비스 구동 시 안전한 키로 변경하는 것이 좋습니다.
  secret: ${JWT_SECRET:your_custom_secret_key_must_be_over_32_bytes_long_here_1234567890}
  expiration-ms: 86400000 # 토큰 유효 기간 (24시간)

# --- 제보 이미지 업로드(Cloudinary) 및 어드민 페이지 설정 추가 ---
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

admin:
  key: ${ADMIN_KEY}