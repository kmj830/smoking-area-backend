plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smoking-area'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {


	/*
	 * Spring Boot 기본 기능
	 */
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	/*
	 * Swagger
	 */
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

	/*
	 * Lombok
	 */
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	/*
	 * 개발 도구
	 */
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	/*
	 * 실제 애플리케이션 실행용 PostgreSQL
	 */
	runtimeOnly 'org.postgresql:postgresql'

	/*
	 * 테스트 실행용 H2 메모리 데이터베이스
	 */
	testRuntimeOnly 'com.h2database:h2'

	/*
	 * Spring Security
	 */
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'

	/*
	 * WebClient 사용
	 */
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	/*
	 * JWT
	 */
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

// 기존 implementation 'com.cloudinary:cloudinary-http5:1.39.0' 대신 아래 두 가지를 명시해 보세요.
	implementation 'com.cloudinary:cloudinary-core:1.39.0'
	implementation 'com.cloudinary:cloudinary-http5:1.39.0'
	/*
	 * 테스트
	 */
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}